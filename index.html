<style id="qms-style">
:root {
  --bg: #EFF0F2;
  --card: #FFFFFF;
  --text: #1A1D22;
  --muted: #5B6270;
  --line: #DADCE1;
  --accent: #7D5F27;
  --field: #FFFFFF;
  --ink: #16181D;
  --slate: #22262E;
  --gold: #E6CD98;
  --gold-hi: #F0DFB6;
  --display: "Jost", "Avenir Next", "Century Gothic", "Segoe UI", sans-serif;
  --body: "Hanken Grotesk", "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161B; --card: #1F232A; --text: #F1EEE7; --muted: #A3A9B4;
    --line: #323844; --accent: #E6CD98; --field: #171A20;
  }
}
:root[data-theme="dark"] {
  --bg: #14161B; --card: #1F232A; --text: #F1EEE7; --muted: #A3A9B4;
  --line: #323844; --accent: #E6CD98; --field: #171A20;
}
html { height: 100%; background: var(--ink); scroll-padding-top: calc(72px + env(safe-area-inset-top, 0px)); scroll-behavior: smooth; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 400 16px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; }
svg { flex: none; }
[hidden] { display: none !important; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; border: 1.5px solid transparent; font-weight: 600; font-size: .95rem; text-decoration: none; line-height: 1.2; text-align: center; }
.btn.gold { background: var(--gold); color: #1A1D22; }
.btn.gold:hover { background: var(--gold-hi); }
.btn.gold:disabled { opacity: .45; cursor: not-allowed; }
.btn.line { border-color: rgba(241,238,231,.4); color: #F1EEE7; background: transparent; }
.btn.line:hover { border-color: var(--gold); }
.btn.ghost { border-color: var(--line); background: transparent; color: var(--text); }
.btn.sm { padding: 8px 14px; font-size: .9rem; }

/* Notice + header */
.notice { background: var(--gold); color: #1A1D22; text-align: center; font-weight: 600; font-size: .9rem; padding: 8px 16px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(22,24,29,.95); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(230,205,152,.2); color: #F1EEE7; }
.bar-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.brand img { width: 40px; height: 40px; border-radius: 10px; }
.brand span { font: 600 1.05rem/1.1 var(--display); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.call-num { display: none; }

/* Hero */
.hero { position: relative; overflow: hidden; color: #F1EEE7; background: linear-gradient(135deg, #3A3F4B 0%, #1F2228 55%, #16181D 100%); }
.rays { position: absolute; right: -240px; top: 50%; width: 760px; height: 570px; transform: translateY(-50%); stroke: var(--gold); stroke-width: 1; opacity: .22; pointer-events: none; }
.hero-in { position: relative; max-width: 1120px; margin: 0 auto; padding: 48px 20px 44px; display: grid; gap: 28px; align-items: center; }
.hero h1 { font-weight: 600; font-size: clamp(2.1rem, 8vw, 3.7rem); line-height: 1.04; letter-spacing: -.01em; max-width: 15ch; margin-bottom: 16px; }
.lead { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 24px; color: #CFCBC2; max-width: 40ch; }
.lead svg { color: var(--gold); margin-top: 2px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; }
.hero-logo { display: none; }

/* Assurance */
.assure { background: var(--card); border-bottom: 1px solid var(--line); }
.assure-in { max-width: 1120px; margin: 0 auto; padding: 8px 16px; display: grid; grid-template-columns: 1fr 1fr; }
.as { display: flex; gap: 12px; padding: 16px 8px; align-items: flex-start; }
.as svg { color: var(--accent); margin-top: 2px; }
.as b { display: block; font: 600 1rem/1.2 var(--display); }
.as span { color: var(--muted); font-size: .88rem; }

/* Sections */
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.sec { padding: 44px 0 20px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.sec-head h2 { font-size: clamp(1.6rem, 5vw, 2.3rem); font-weight: 600; }
.count { color: var(--muted); margin: 0; font-size: .9rem; }
.tools { display: grid; gap: 12px; margin-bottom: 20px; }
.search { width: 100%; max-width: 420px; border: 1.5px solid var(--line); background: var(--field); border-radius: 10px; padding: 11px 14px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 16px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--gold); color: var(--gold); }

/* Products */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
@media (min-width: 960px) { .grid { grid-template-columns: repeat(4, 1fr); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.ph { position: relative; aspect-ratio: 1 / 1; background: #262A32; display: grid; place-items: center; color: var(--gold); }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.card.out .ph img { filter: grayscale(1); }
.tags { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: rgba(22,24,29,.85); color: var(--gold); font-weight: 600; font-size: .74rem; padding: 3px 9px; border-radius: 999px; border: 1px solid rgba(230,205,152,.4); }
.tag.hot { background: var(--gold); color: #1A1D22; border-color: var(--gold); }
.sold { position: absolute; inset: 0; background: rgba(22,24,29,.62); display: grid; place-items: center; color: #fff; font: 600 1.15rem var(--display); }
.pb { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.pb h3 { font-size: 1.05rem; font-weight: 600; line-height: 1.2; }
.meta { margin: 0; color: var(--muted); font-size: .85rem; }
.price { margin: 6px 0 10px; font: 700 1.2rem/1.1 var(--display); color: var(--accent); }
.price.ask { font-size: 1rem; color: var(--muted); font-weight: 600; }
.pb .btn { margin-top: auto; width: 100%; font-size: .9rem; padding: 10px 10px; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 36px 12px; }
.empty a { color: var(--accent); font-weight: 600; }

/* Exchange */
.band { background: var(--slate); color: #F1EEE7; margin-top: 28px; }
.band-in { max-width: 1120px; margin: 0 auto; padding: 44px 16px; display: grid; gap: 24px; }
.band h2 { font-size: clamp(1.6rem, 5vw, 2.3rem); font-weight: 600; margin-bottom: 10px; }
.band p { margin: 0; color: #CFCBC2; max-width: 44ch; }
.xform { display: grid; gap: 12px; }
.xform label { font-weight: 600; font-size: .9rem; display: block; }
.xform input { width: 100%; margin-top: 6px; padding: 12px; border-radius: 10px; border: 1.5px solid #3D4350; background: #16181D; color: #F1EEE7; }
.xform input::placeholder { color: #8C93A0; }

/* Delivery */
.steps { display: grid; gap: 14px; margin-top: 8px; }
.step { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; }
.step i { font: 600 1.05rem/1 var(--display); font-style: normal; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--gold); border: 1.5px solid var(--gold); }
.step b { display: block; font: 600 1.1rem/1.2 var(--display); margin-bottom: 2px; }
.step span { color: var(--muted); }

/* Owner + visit */
.owner { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.owner img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
.owner b { font: 600 1.1rem var(--display); display: block; margin-bottom: 4px; }
.owner p { margin: 0; color: var(--muted); }
.visit { display: grid; gap: 20px; }
.info { display: grid; gap: 14px; }
.info div { display: flex; gap: 12px; align-items: flex-start; }
.info svg { color: var(--accent); margin-top: 2px; }
.info a { font-weight: 600; }
.vbtns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }

footer { background: var(--ink); color: #A9ADB6; margin-top: 44px; padding: 28px 16px calc(96px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: .88rem; }
footer b { color: var(--gold); font-family: var(--display); font-size: 1.05rem; display: block; margin-bottom: 4px; }

/* Floating buttons */
.fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; width: 56px; height: 56px; border-radius: 50%; background: #1FA855; color: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
.fab svg { width: 28px; height: 28px; }
.fab-adm { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; gap: 8px; align-items: center; background: var(--ink); color: var(--gold); border: 1.5px solid var(--gold); border-radius: 999px; padding: 12px 18px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.3); }

.local-note { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 10px; padding: 12px 14px; margin: 0 0 16px; font-size: .9rem; color: var(--muted); }
.local-note b { color: var(--text); }
/* Music */
.mus { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px 0 16px; border-radius: 999px; background: var(--ink); color: var(--gold); border: 1.5px solid var(--gold); font-weight: 600; font-size: .9rem; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.mus.on { background: var(--gold); color: #1A1D22; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 18px; }
.bars i { display: block; width: 3px; height: 6px; background: currentColor; border-radius: 2px; }
.mus.on .bars i { animation: qbar .9s ease-in-out infinite; }
.mus.on .bars i:nth-child(2) { animation-delay: .2s; }
.mus.on .bars i:nth-child(3) { animation-delay: .4s; }
@keyframes qbar { 0%, 100% { height: 5px; } 50% { height: 18px; } }
@media (prefers-reduced-motion: reduce) { .mus.on .bars i { animation: none; height: 12px; } }
.fab-adm { bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important; }
/* Owner login */
.gate { position: fixed; inset: 0; z-index: 80; background: rgba(22,24,29,.92); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.gate-box { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; }
.gate-box h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 6px; }
.gate-box > p { margin: 0 0 14px; color: var(--muted); font-size: .92rem; }
.gate-box label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 12px; }
.gate-box input[type="password"], .gate-box input[type="text"] { display: block; width: 100%; margin-top: 6px; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--field); }
/* Admin */
.adm { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
.adm-in { max-width: 760px; margin: 0 auto; }
.adm-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 6px 0 14px; }
.adm-head h2 { font-size: 1.6rem; font-weight: 600; }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
.tabs button { flex: none; border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 18px; font-weight: 600; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--gold); border-color: var(--gold); }
.row { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row .th { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: #262A32; display: grid; place-items: center; color: var(--gold); }
.row b { display: block; line-height: 1.2; }
.row small { color: var(--muted); }
.rbtn { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.rbtn button { border: 1.5px solid var(--line); background: transparent; border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: .88rem; }
.rbtn button.on { background: #1E7A47; border-color: #1E7A47; color: #fff; }
.rbtn button.warn { border-color: #C0392B; color: #C0392B; }
.rbtn button.warn.sure { background: #C0392B; color: #fff; }
.form label, .fld label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 14px; }
.form input:not([type=checkbox]):not([type=file]), .form select, .form textarea, .fld input, .fld textarea { display: block; width: 100%; margin-top: 6px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--field); }
.form textarea, .fld textarea { min-height: 90px; resize: vertical; }
.form small, .fld small { display: block; color: var(--muted); font-weight: 400; margin-top: 4px; }
.check { display: flex !important; align-items: center; gap: 10px; font-weight: 500 !important; }
.check input { width: 20px; height: 20px; margin: 0; }
.photo { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.photo img { width: 96px; height: 96px; object-fit: cover; border-radius: 12px; background: #262A32; }
.frow { display: flex; gap: 10px; margin-top: 8px; }
.err { color: #C0392B; font-weight: 600; min-height: 1.2em; margin: 6px 0 0; }
.tips { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
.tips li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.tips b { display: block; font: 600 1.05rem var(--display); margin-bottom: 2px; }
.tips span { color: var(--muted); }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.savebar span { font-size: .88rem; color: var(--muted); }

@media (min-width: 700px) {
  .call-num { display: inline; }
  .call-lbl { display: none; }
  .assure-in { grid-template-columns: repeat(4, 1fr); }
  .band-in { grid-template-columns: 1fr 1fr; align-items: center; gap: 48px; }
  .steps { grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .visit { grid-template-columns: 1fr 1fr; align-items: center; }
  .row { grid-template-columns: 56px 1fr auto; }
  .rbtn { grid-column: auto; }
}
@media (min-width: 900px) {
  .hero-in { grid-template-columns: 1.25fr .75fr; padding: 72px 20px 68px; }
  .hero-logo { display: block; justify-self: center; position: relative; }
  .hero-logo img { width: 300px; height: 300px; border-radius: 28px; border: 1px solid rgba(230,205,152,.5); box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .rays { right: -60px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    '<div class="photo"><img id="f-prev" alt="" ' + (p.img ? 'src="' + esc(p.img) + '"' : 'hidden') + '><label class="btn ghost" style="margin:0">Chagua picha<input id="f-file" type="file" accept="image/*" hidden></label></div>' +
    '<label class="check"><input id="f-stock" type="checkbox"' + (p.stock ? ' checked' : '') + '> Ipo dukani</label>' +
    '<label class="check"><input id="f-hot" type="checkbox"' + (p.hot ? ' checked' : '') + '> Weka alama ya "Inauzika sana"</label>' +
    '<p class="err" id="f-err"></p>' +
    '<div class="frow"><button class="btn gold" data-act="save-prod">Weka simu</button><button class="btn ghost" data-act="cancel-prod">Ghairi</button></div></div>';
}

function shopForm() {
  var S = state.shop;
  function f(key, label, hint, area) {
    return '<label>' + label + (area ? '<textarea data-shop="' + key + '">' + esc(S[key]) + '</textarea>' : '<input data-shop="' + key + '" value="' + esc(S[key]) + '">') + (hint ? '<small>' + hint + '</small>' : '') + '</label>';
  }
  return '<div class="fld">' +
    f('name', 'Jina la duka') +
    f('tagline', 'Kichwa kikubwa cha ukurasa', 'Sentensi fupi inayoonekana kwanza.') +
    f('notice', 'Tangazo la juu (ofa)', 'Acha wazi kama hakuna tangazo.') +
    f('phone', 'Namba ya simu na WhatsApp', 'Mfano: 0627442748. Oda zote za WhatsApp zinakuja kwenye namba hii.') +
    f('address', 'Mahali duka lilipo') +
    f('hours', 'Saa za kufungua', 'Mfano: Jumatatu hadi Jumamosi, 2:00 asubuhi hadi 12:00 jioni. Acha wazi kama hutaki kuonyesha.') +
    f('instagram', 'Jina la Instagram', 'Bila @.') +
    f('ownerName', 'Jina la mmiliki') +
    f('ownerNote', 'Ujumbe kutoka kwa mmiliki', '', true) + '</div>';
}

function renderAdmin() {
  var root = $('#admin-root');
  if (!ui.admin) { root.innerHTML = ''; return; }
  if (mus.audio && !mus.audio.paused) { musPause(); mus.paused = true; }
  var body = '';
  if (ui.tab === 'bidhaa') {
    body = ui.editing !== null ? productForm() : '<div style="margin-bottom:8px"><button class="btn gold" data-act="new">Ongeza simu</button></div>' + productRows();
  } else if (ui.tab === 'duka') {
    body = shopForm() + pwForm();
  } else {
    body = '<ul class="tips">' + TIPS.map(function (t) { return '<li><b>' + t[0] + '</b><span>' + t[1] + '</span></li>'; }).join('') + '</ul>';
  }
  var note = local() ? '<p class="local-note"><b>Jinsi ya kuweka mabadiliko mtandaoni:</b> fanya mabadiliko yako, kisha bonyeza "Pakua faili jipya" chini. Faili litashuka kwenye simu au kompyuta yako. Lipakie kwenye hosting yako mahali pa faili la zamani (jina lile lile), kisha wateja wataona mabadiliko.</p>' : '';
  root.innerHTML = '<div class="adm" role="dialog" aria-label="Simamia duka"><div class="adm-in">' +
    '<div class="adm-head"><h2>Simamia duka</h2><button class="btn ghost sm" data-act="close">Funga</button></div>' +
    '<div class="tabs">' + [['bidhaa', 'Simu'], ['duka', 'Duka'], ['mapendekezo', 'Mapendekezo']].map(function (t) { return '<button data-act="tab" data-tab="' + t[0] + '" aria-pressed="' + (ui.tab === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div>' +
    note + body + '</div>' +
    '<div class="savebar"><span id="save-status"></span><button class="btn gold" data-act="publish">' + (local() ? 'Pakua faili jipya' : 'Hifadhi na weka mtandaoni') + '</button></div></div>';
  updateSaveBar();
}

function setStatus(t) { ui.status = t; var s = $('#save-status'); if (s) s.textContent = t; }
function updateSaveBar() {
  var b = $('[data-act="publish"]'); if (b) b.disabled = !ui.dirty;
  setStatus(ui.status || (ui.dirty ? 'Una mabadiliko ambayo bado hayajahifadhiwa.' : 'Hakuna mabadiliko mapya.'));
}
function markDirty() { ui.dirty = true; ui.status = ''; updateSaveBar(); }

function readImg(file) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onerror = rej;
    fr.onload = function () {
      var im = new Image();
      im.onerror = rej;
      im.onload = function () {
        var s = Math.min(1, 800 / Math.max(im.width, im.height)), w = Math.round(im.width * s), h = Math.round(im.height * s);
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function favLinks() {
  return Array.prototype.map.call(document.querySelectorAll('link[data-fav]'), function (l) { return l.outerHTML; }).join('');
}
function buildDoc() {
  var au = document.getElementById('qms-audio');
  var audioTag = au ? '<' + 'script id="qms-audio" type="text/plain">' + au.textContent + '<' + '/script>' : '';
  var json = JSON.stringify(state).replace(/</g, '\\u003c');
  var css = document.getElementById('qms-style').textContent;
  var code = document.getElementById('qms-code').textContent;
  return '<!doctype html>\n<html lang="sw"><head>' + HEAD_STATIC + favLinks() + '<style id="qms-style">' + css + '</style></head><body><div id="app"></div><div id="admin-root"></div>' +
    audioTag + '<' + 'script id="qms-data" type="application/json">' + json + '<' + '/script>' +
    '<' + 'script id="qms-code">' + code + '<' + '/script></body></html>';
}

function downloadDoc() {
  try {
    var blob = new Blob([buildDoc()], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    ui.dirty = false; setStatus('Faili jipya (index.html) limepakuliwa. Lipakie kwenye hosting yako.');
  } catch (e) { setStatus('Imeshindwa kupakua faili. Jaribu tena.'); }
}
function publish() {
  var cl = window.claude;
  if (!ui.viaClaude || !cl || !cl.use) { downloadDoc(); return; }
  setStatus('Inahifadhi...');
  cl.use('artifact').then(function (art) {
    if (!art) throw { code: 'not_granted' };
    return art.publish(buildDoc());
  }).then(function () {
    ui.dirty = false; setStatus('Imehifadhiwa. Ukurasa unajipakia upya...');
  }).catch(function (e) {
    var m = {
      not_writer: 'Huna ruhusa ya kuhifadhi mabadiliko kwenye tovuti hii.',
      not_granted: 'Huna ruhusa ya kuhifadhi mabadiliko kwenye tovuti hii.',
      too_large: 'Picha ni nyingi mno. Punguza picha au futa simu zisizohitajika.',
      rate_limited: 'Umehifadhi mara nyingi. Subiri dakika moja kisha ujaribu tena.',
      conflict: 'Toleo jipya limewekwa na mtu mwingine. Ukurasa unapakia upya.'
    };
    setStatus(m[e && e.code] || 'Imeshindwa kuhifadhi. Jaribu tena.');
  });
}

function findP(id) { return state.products.filter(function (p) { return p.id === id; })[0]; }

var tap = { n: 0, t: 0 };
document.addEventListener('click', function (e) {
  if (e.target.closest('.brand')) {
    var now = Date.now(); tap.n = (now - tap.t < 2500) ? tap.n + 1 : 1; tap.t = now;
    if (tap.n >= 5) { tap.n = 0; e.preventDefault(); openGate(); return; }
  }
  var chip = e.target.closest('[data-brand]');
  if (chip) { ui.brand = chip.getAttribute('data-brand'); renderProducts(); musAuto(); return; }
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), id = b.getAttribute('data-id'), p;
  if (act === 'mus') { musToggle(); }
  else if (act === 'gate-ok') { gateOk(); }
  else if (act === 'gate-cancel') { closeGate(); }
  else if (act === 'pw-change') { pwChange(); }
  else if (act === 'open') { ui.admin = true; ui.tab = 'bidhaa'; ui.editing = null; renderAdmin(); }
  else if (act === 'close') { ui.admin = false; ui.editing = null; ui.canEdit = false; renderApp(); renderAdmin(); }
  else if (act === 'tab') { ui.tab = b.getAttribute('data-tab'); ui.editing = null; renderAdmin(); }
  else if (act === 'new') { ui.editing = 'new'; renderAdmin(); }
  else if (act === 'edit') { ui.editing = id; renderAdmin(); }
  else if (act === 'cancel-prod') { ui.editing = null; renderAdmin(); }
  else if (act === 'stock') { p = findP(id); if (p) { p.stock = !p.stock; markDirty(); renderAdmin(); } }
  else if (act === 'hot') { p = findP(id); if (p) { p.hot = !p.hot; markDirty(); renderAdmin(); } }
  else if (act === 'del') {
    if (ui.confirmDel === id) { state.products = state.products.filter(function (x) { return x.id !== id; }); ui.confirmDel = null; markDirty(); }
    else { ui.confirmDel = id; }
    renderAdmin();
  }
  else if (act === 'save-prod') {
    var name = $('#f-name').value.trim();
    if (!name) { $('#f-err').textContent = 'Andika jina la simu.'; return; }
    var pr = digits($('#f-price').value);
    var existing = ui.editing === 'new' ? null : findP(ui.editing);
    var obj = {
      id: existing ? existing.id : 'p' + Date.now().toString(36),
      name: name, brand: $('#f-brand').value.trim(), price: pr ? parseInt(pr, 10) : null,
      cond: $('#f-cond').value, storage: $('#f-storage').value.trim(), note: $('#f-note').value.trim(),
      img: ui.formImg, stock: $('#f-stock').checked, hot: $('#f-hot').checked
    };
    if (existing) state.products[state.products.indexOf(existing)] = obj; else state.products.unshift(obj);
    ui.editing = null; markDirty(); renderAdmin(); renderProducts();
  }
  else if (act === 'publish') { publish(); }
});

document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'q') { ui.q = t.value; renderProducts(); }
  else if (t.id === 'ex-mine' || t.id === 'ex-want') { updateExchange(); }
  else if (t.hasAttribute && t.hasAttribute('data-shop')) { state.shop[t.getAttribute('data-shop')] = t.value; markDirty(); }
});

document.addEventListener('change', function (e) {
  if (e.target.id === 'f-file' && e.target.files && e.target.files[0]) {
    readImg(e.target.files[0]).then(function (d) {
      ui.formImg = d; var pv = $('#f-prev'); if (pv) { pv.src = d; pv.hidden = false; }
    }).catch(function () { var er = $('#f-err'); if (er) er.textContent = 'Picha imeshindwa kusomwa. Jaribu picha nyingine.'; });
  }
});

function detectEditor() {
  var cl = window.claude;
  if (!cl || !cl.use) return;
  Promise.all([cl.use('artifact'), cl.use('user')]).then(function (r) {
    if (!r[0] || !r[1]) return null;
    return r[1].canEdit();
  }).then(function (ok) {
    if (ok) { ui.viaClaude = true; }
  }).catch(function () {});
}

renderApp();
renderAdmin();
detectEditor();
musInit();
checkHash();
window.addEventListener('hashchange', checkHash);
document.addEventListener('focusin', function (e) { if (e.target && e.target.id === 'q') musAuto(); });
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (e.key === 'Enter' && t && t.id && t.id.indexOf('g-') === 0 && t.type !== 'checkbox') { e.preventDefault(); gateOk(); }
  else if (e.key === 'Escape' && document.querySelector('.gate')) { closeGate(); }
});
document.addEventListener('change', function (e) {
  if (e.target && e.target.id === 'g-show') {
    ['g-pw', 'g-pw2'].forEach(function (id) { var el = document.getElementById(id); if (el) el.type = e.target.checked ? 'text' : 'password'; });
  }
});
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { if (mus.audio && !mus.audio.paused) { mus.resume = true; musPause(); } }
  else if (mus.resume) { mus.resume = false; if (!mus.paused && !ui.admin) musPlay(); }
});
window.addEventListener('beforeunload', function (e) { if (ui.dirty) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
